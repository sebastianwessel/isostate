risks:
  - This change specifies a new public package but does not implement code, docs examples, or tests.
  - The editor necessarily uses heavier browser authoring dependencies; implementation must keep them isolated from the core runtime graph.
  - The visual editor must round-trip YAML deterministically without introducing editor-only authored fields.
  - Browser-safe DSL export requires careful module boundaries so parser/compiler code can be used by the editor without pulling local-process CLI or filesystem code into browser bundles.
  - Editor-support APIs must stay runtime-safe and covered by focused geometry/hit-test tests because editor interaction accuracy depends on them.
  - Without browser automation in v1, visual interaction regressions require careful manual review until a later UI test suite is added.
