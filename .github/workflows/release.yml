name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  release:
    name: Publish npm packages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package versions
        run: |
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          CLI_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          CLI_CORE_DEP="$(node -p "require('./packages/cli/package.json').dependencies['@sebastianwessel/isostate']")"

          if [ "$CORE_VERSION" != "$CLI_VERSION" ]; then
            echo "Package versions must match: core=$CORE_VERSION cli=$CLI_VERSION" >&2
            exit 1
          fi

          if [ "$CLI_CORE_DEP" != "$CORE_VERSION" ]; then
            echo "CLI dependency on @sebastianwessel/isostate must equal package version: dep=$CLI_CORE_DEP version=$CORE_VERSION" >&2
            exit 1
          fi

          TAG="v$CORE_VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

          echo "version=$CORE_VERSION" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_ENV"

      - name: Verify npm versions are new
        run: |
          if npm view "@sebastianwessel/isostate@$version" version >/dev/null 2>&1; then
            echo "@sebastianwessel/isostate@$version is already published" >&2
            exit 1
          fi

          if npm view "@sebastianwessel/isostate-cli@$version" version >/dev/null 2>&1; then
            echo "@sebastianwessel/isostate-cli@$version is already published" >&2
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Build website
        run: bun run site:build
        env:
          PUBLIC_ISOSTATE_VERSION: ${{ env.version }}

      - name: Package lint
        run: bun run publint

      - name: Publish core package
        run: npm publish --access public --provenance packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package
        run: npm publish --access public --provenance packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          generate_release_notes: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
