name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - packages/core/package.json
      - packages/cli/package.json
      - packages/editor/package.json

permissions:
  contents: read

concurrency:
  group: isostate-production
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm packages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun ci

      - name: Format
        run: bun run format

      - name: Verify formatting is committed
        run: git diff --exit-code

      - name: Verify package versions
        run: bun scripts/check-release-versions.ts >> "$GITHUB_ENV"

      - name: Verify git tag is new
        run: |
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

      - name: Verify npm versions are new
        run: bun scripts/check-npm-release.ts "$version"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Coverage
        run: bun run coverage

      - name: Size
        run: bun run size

      - name: Package lint
        run: bun run publint

      - name: Generate basic example bundle
        run: bun run examples:basic:bundle

      - name: Build and upload website artifact
        uses: withastro/action@v6
        with:
          path: .
          node-version: 24
          package-manager: bun@1.4.2
          build-cmd: bun run site:build
          out-dir: website/dist
        env:
          PUBLIC_ISOSTATE_VERSION: ${{ env.version }}

      - name: Verify lockfile remained unchanged
        run: git diff --exit-code -- bun.lock package.json packages/core/package.json packages/cli/package.json packages/editor/package.json

      - name: Verify npm CLI supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)" node --input-type=module -e '
            const version = process.env.NPM_VERSION;
            const [major, minor, patch] = version.split(".").map(Number);
            if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
              throw new Error(`npm >=11.5.1 is required for trusted publishing; found ${version}`);
            }
          '

      - name: Publish core package
        run: npm publish --access public --provenance ./packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CLI package
        run: npm publish --access public --provenance ./packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: ${{ env.tag }}
          generate_release_notes: true

  deploy:
    name: Deploy website to GitHub Pages
    runs-on: ubuntu-latest
    needs: release
    permissions:
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
