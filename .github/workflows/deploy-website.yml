name: Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isostate-production
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun ci

      - name: Build and upload website artifact
        uses: withastro/action@v6
        with:
          path: .
          node-version: 24
          package-manager: bun@1.4.2
          build-cmd: bun run build && bun run site:build
          out-dir: website/dist

      - name: Verify lockfile remained unchanged
        run: git diff --exit-code -- bun.lock package.json packages/core/package.json packages/cli/package.json packages/editor/package.json

  deploy:
    name: Deploy website to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
