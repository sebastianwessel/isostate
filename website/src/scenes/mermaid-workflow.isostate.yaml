# Native one-cell sprites retain the original stage palettes and isometric view.
# Each caption has its own whole-cell band below the artwork.
header:
  version: "1.0"
  name: mermaid-workflow-story
  className: mermaid-workflow-surface
  assetBaseUrl: ../../../assets/isostate-story
  assets:
    - id: mermaid-workflow-sheet
      type: sprite-sheet
      path: mermaid-workflow-sheet.png
      sheetSize: [1774, 887]
      sprites:
        mermaid-source-workspace:
          rect: [0, 0, 443, 443]
          anchor: [0.5, 0.93]
        mermaid-skill-pack:
          rect: [443, 0, 444, 443]
          anchor: [0.5, 0.94]
        mermaid-ai-workbench:
          rect: [887, 0, 443, 443]
          anchor: [0.5, 0.94]
        mermaid-yaml-blueprint:
          rect: [1330, 0, 444, 443]
          anchor: [0.5, 0.94]
        mermaid-asset-kit:
          rect: [0, 443, 466, 444]
          anchor: [0.5, 0.91]
        mermaid-verified-bundle:
          rect: [480, 443, 407, 444]
          anchor: [0.5, 0.92]
        mermaid-editor-console:
          rect: [887, 443, 443, 444]
          anchor: [0.5, 0.93]
  grid:
    cellSize: 64
  floor:
    visible: false
    layer: ground
  layers:
    - name: ground
    - name: zones
    - name: routes
    - name: cards
    - name: labels
scenes:
  - id: workspace
    camera:
      target:
        area:
          at: [4, 4]
          size: [1, 1]
      padding: 72
      duration: 500
      easing: ease-out
    elements:
      - id: workspace-zone
        asset: rectangle
        layer: zones
        at: [2, 2]
        size: 3
        enter: fade-in-grow
        primitive:
          rectangle:
            fill: "#ecfdf5"
            stroke: "#5eead4"
            strokeWidth: 1
            opacity: 0.12
      - id: mermaid-source
        asset: mermaid-source-workspace
        layer: cards
        at: [3, 3]
        size: 1
        enter: rise-from-ground
      - id: mermaid-source-label
        asset: text
        layer: labels
        at: [5, 5]
        text:
          value: |-
            Mermaid
            source
          fontSize: 21
          fill: var(--mermaid-label)
  - id: skills-installed
    camera:
      target:
        area:
          at: [4, 3]
          size: [4, 2]
      padding: 72
      duration: 500
      easing: ease-in-out
    add:
      elements:
        - id: skills-zone
          asset: rectangle
          layer: zones
          at: [6, 2]
          size: 3
          enter: fade-in-grow
          primitive:
            rectangle:
              fill: "#fffbeb"
              stroke: "#fbbf24"
              strokeWidth: 1
              opacity: 0.12
        - id: skill-pack
          asset: mermaid-skill-pack
          layer: cards
          at: [7, 3]
          size: 1
          enter: slide-in-right
        - id: skill-pack-label
          asset: text
          layer: labels
          at: [9, 5]
          text:
            value: |-
              Agent
              skills
            fontSize: 21
            fill: var(--mermaid-label)
      connections:
        - id: source-to-skills
          from:
            element: mermaid-source
            side: right
          to:
            element: skill-pack
            side: left
          routing:
            mode: orthogonal
            avoid: objects
            clearance: 0.5
          layer: routes
          enter: slide-in-right
          style:
            pattern: dotted
            stroke: "#0f766e"
            strokeWidth: 3
          start: dot
          end: arrow
          ambient:
            - name: flow
  - id: ai-generation
    camera:
      target:
        area:
          at: [7, 5]
          size: [1, 1]
      padding: 136
      duration: 500
      easing: ease-in-out
    add:
      elements:
        - id: ai-zone
          asset: rectangle
          layer: zones
          at: [6, 6]
          size: 3
          enter: fade-in-grow
          primitive:
            rectangle:
              fill: "#f5f3ff"
              stroke: "#a78bfa"
              strokeWidth: 1
              opacity: 0.12
        - id: ai-agent
          asset: mermaid-ai-workbench
          layer: cards
          at: [7, 7]
          size: 1
          enter: rise-from-ground
        - id: ai-agent-label
          asset: text
          layer: labels
          at: [9, 9]
          text:
            value: |-
              AI
              workbench
            fontSize: 21
            fill: var(--mermaid-label)
      connections:
        - id: skills-to-ai
          from:
            element: skill-pack
            side: bottom
          to:
            element: ai-agent
            side: left
          routing:
            mode: orthogonal
            avoid: objects
            clearance: 0.5
          layer: routes
          enter: rise-from-ground
          style:
            pattern: dotted
            stroke: "#7c3aed"
            strokeWidth: 3
          start: none
          end: arrow
          ambient:
            - name: flow
    update:
      connections:
        - id: source-to-skills
          style:
            stroke: "#94a3b8"
            strokeWidth: 3
            opacity: 0.38
          ambient: []
  - id: output-created
    camera:
      target:
        area:
          at: [7, 6]
          size: [5, 2]
      padding: 160
      duration: 500
      easing: ease-in-out
    add:
      elements:
        - id: output-zone
          asset: rectangle
          layer: zones
          at: [10, 4]
          size: 3
          enter: fade-in-grow
          primitive:
            rectangle:
              fill: "#eff6ff"
              stroke: "#60a5fa"
              strokeWidth: 1
              opacity: 0.12
        - id: yaml-file
          asset: mermaid-yaml-blueprint
          layer: cards
          at: [11, 5]
          size: 1
          enter: slide-in-right
        - id: yaml-file-label
          asset: text
          layer: labels
          at: [13, 7]
          text:
            value: |-
              Scene
              YAML
            fontSize: 21
            fill: var(--mermaid-label)
        - id: asset-kit
          asset: mermaid-asset-kit
          layer: cards
          at: [12, 11]
          size: 1
          enter: slide-in-right
        - id: asset-kit-label
          asset: text
          layer: labels
          at: [14, 13]
          text:
            value: |-
              Asset
              catalog
            fontSize: 21
            fill: var(--mermaid-label)
        - id: assets-zone
          asset: rectangle
          layer: zones
          at: [11, 10]
          size: 3
          enter: fade-in-grow
          primitive:
            rectangle:
              fill: "#fff7ed"
              stroke: "#fb923c"
              strokeWidth: 1
              opacity: 0.12
      connections:
        - id: ai-to-yaml
          from:
            element: ai-agent
            side: right
          to:
            element: yaml-file
            side: left
          routing:
            mode: orthogonal
            avoid: objects
            clearance: 0.5
          layer: routes
          enter: slide-in-right
          style:
            pattern: solid
            stroke: "#2563eb"
            strokeWidth: 3
          start: none
          end: arrow
          ambient:
            - name: flow
        - id: ai-to-assets
          from:
            element: ai-agent
            side: bottom
          to:
            element: asset-kit
            side: left
          routing:
            mode: orthogonal
            avoid: objects
            clearance: 0.5
          layer: routes
          enter: fade-in
          style:
            pattern: dashed
            stroke: "#ea580c"
            strokeWidth: 3
          start: none
          end: arrow
          ambient:
            - name: flow
    update:
      connections:
        - id: skills-to-ai
          style:
            stroke: "#c4b5fd"
            strokeWidth: 3
            opacity: 0.44
          ambient: []
  - id: validated-bundled
    camera:
      target:
        area:
          at: [8, 5]
          size: [6, 2]
      padding: 152
      duration: 500
      easing: ease-in-out
    add:
      elements:
        - id: validation-zone
          asset: rectangle
          layer: zones
          at: [14, 4]
          size: 3
          enter: fade-in-grow
          primitive:
            rectangle:
              fill: "#f0fdf4"
              stroke: "#22c55e"
              strokeWidth: 1
              opacity: 0.12
        - id: runtime-bundle
          asset: mermaid-verified-bundle
          layer: cards
          at: [15, 5]
          size: 1
          enter: rise-from-ground
        - id: runtime-bundle-label
          asset: text
          layer: labels
          at: [17, 7]
          text:
            value: |-
              Runtime
              bundle
            fontSize: 21
            fill: var(--mermaid-label)
      connections:
        - id: yaml-to-bundle
          from:
            element: yaml-file
            side: right
          to:
            element: runtime-bundle
            side: left
          routing:
            mode: orthogonal
            avoid: objects
            clearance: 0.5
          layer: routes
          enter: rise-from-ground
          style:
            pattern: dotted
            stroke: "#16a34a"
            strokeWidth: 3
          start: none
          end: arrow
          ambient:
            - name: flow
    update:
      connections:
        - id: ai-to-yaml
          style:
            stroke: "#bfdbfe"
            strokeWidth: 3
            opacity: 0.45
          ambient: []
        - id: ai-to-assets
          style:
            pattern: dashed
            stroke: "#fed7aa"
            strokeWidth: 3
            opacity: 0.48
          ambient: []
  - id: editor-finetune
    camera:
      target:
        area:
          at: [7, 6]
          size: [8, 1]
      padding: 160
      duration: 500
      easing: ease-in-out
    add:
      elements:
        - id: editor-zone
          asset: rectangle
          layer: zones
          at: [14, 9]
          size: 3
          enter: fade-in-grow
          primitive:
            rectangle:
              fill: "#f8fafc"
              stroke: "#94a3b8"
              strokeWidth: 1
              opacity: 0.12
        - id: editor-window
          asset: mermaid-editor-console
          layer: cards
          at: [15, 10]
          size: 1
          enter: slide-in-right
        - id: editor-window-label
          asset: text
          layer: labels
          at: [17, 12]
          text:
            value: |-
              Visual
              editor
            fontSize: 21
            fill: var(--mermaid-label)
      connections:
        - id: bundle-to-editor
          from:
            element: runtime-bundle
            side: bottom
          to:
            element: editor-window
            side: top
          routing:
            mode: orthogonal
            avoid: objects
            clearance: 0.5
          layer: routes
          enter: slide-in-left
          style:
            pattern: dotted
            stroke: "#0f766e"
            strokeWidth: 3
          start: none
          end: arrow
          ambient:
            - name: flow
        - id: assets-to-editor
          from:
            element: asset-kit
            side: right
          to:
            element: editor-window
            side: left
          routing:
            mode: orthogonal
            avoid: objects
            clearance: 0.5
          layer: routes
          enter: fade-in
          style:
            pattern: dashed
            stroke: "#94a3b8"
            strokeWidth: 3
            opacity: 0.7
          start: none
          end: arrow
    update:
      connections:
        - id: yaml-to-bundle
          style:
            stroke: "#bbf7d0"
            strokeWidth: 3
            opacity: 0.46
          ambient: []
