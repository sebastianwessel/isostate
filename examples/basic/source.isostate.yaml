header:
  version: "0.1"
  name: aws-network-3d-flow
  assetBaseUrl: ../../assets/aws-3d
  assets:
    - id: aws-end-user
      path: end-user
      anchor: [0.5, 1]
    - id: aws-client
      path: client
      anchor: [0.5, 1]
    - id: aws-internet-gateway
      path: internet-gateway
      anchor: [0.125, 1]
    - id: aws-vpc-gateway
      path: vpc-gateway
      anchor: [0.875, 1]
    - id: aws-load-balancer
      path: elastic-load-balancing
      anchor: [0.5, 1]
    - id: aws-app-server
      path: application-server
      anchor: [0.5, 1]
    - id: aws-lambda
      path: lambda
      anchor: [0.5, 1]
    - id: aws-rds
      path: rds
      anchor: [0.5, 1]
    - id: aws-s3
      path: s3-bucket
      anchor: [0.5, 1]
  grid:
    cellSize: 64
  floor:
    visible: true
    layer: ground
  layers:
    - name: ground
    - name: network
    - name: compute
    - name: data
    - name: labels

scenes:
  - id: edge-entry
    elements:
      - id: public-edge-zone
        asset: rectangle
        layer: ground
        at: [2, 3]
        size: 2
        primitive:
          rectangle:
            fill: var(--iso-zone-public-fill)
            stroke: var(--iso-zone-public-stroke)
            strokeWidth: 1
            opacity: 0.08
      - id: user
        asset: aws-end-user
        layer: network
        at: [0, 6]
      - id: client
        asset: aws-client
        layer: network
        at: [1, 5]
      - id: internet-gateway
        asset: aws-internet-gateway
        layer: network
        at: [3, 4]
      - id: edge-label
        asset: text
        layer: labels
        at: [3, 2]
        text:
          value: |
            Public
            Edge
          align: middle
          fontSize: 12
          fontWeight: 700
          lineHeight: 1.2
          fill: var(--iso-label)
    connections:
      - id: user-to-client
        from:
          element: user
          side: auto
        to:
          element: client
          side: auto
        style:
          pattern: solid
          stroke: var(--iso-route)
          strokeWidth: 4
        start: dot
        end: arrow
      - id: client-to-edge
        from:
          element: client
          side: auto
        to:
          element: internet-gateway
          side: auto
        routing:
          mode: orthogonal
          avoid: objects
        style:
          pattern: dotted
          stroke: var(--iso-flow)
          strokeWidth: 4
        end: arrow
        ambient:
          - name: flow

  - id: secured-vpc
    add:
      elements:
        - id: private-vpc-zone
          asset: rectangle
          layer: ground
          at: [5, 3]
          size: 2
          primitive:
            rectangle:
              fill: var(--iso-zone-private-fill)
              stroke: var(--iso-zone-private-stroke)
              strokeWidth: 1
              opacity: 0.12
        - id: vpc-gateway
          asset: aws-vpc-gateway
          layer: network
          at: [5, 4]
        - id: auth-label
          asset: text
          layer: labels
          at: [6, 2]
          text:
            value: |
              Private
              VPC
            align: middle
            fontSize: 12
            fontWeight: 700
            lineHeight: 1.2
            fill: var(--iso-label)
      connections:
        - id: edge-to-vpc
          from:
            element: internet-gateway
            side: auto
          to:
            element: vpc-gateway
            side: auto
          routing:
            mode: orthogonal
            avoid: objects
          style:
            pattern: dashed
            stroke: var(--iso-flow)
            strokeWidth: 4
          end: arrow
          ambient:
            - name: flow
    update:
      elements:
        - id: edge-label
          text:
            value: |
              Authenticated
              Edge
            align: middle
            fontSize: 12
            fontWeight: 700
            lineHeight: 1.2
            fill: var(--iso-label)

  - id: compute-tier
    camera:
      target:
        area:
          at: [7, 2]
          size: [5, 5]
      padding: 48
      easing: ease-in-out
    add:
      elements:
        - id: load-balancer
          asset: aws-load-balancer
          layer: compute
          at: [8, 4]
        - id: app-server-a
          asset: aws-app-server
          layer: compute
          at: [10, 3]
        - id: app-server-b
          asset: aws-app-server
          layer: compute
          at: [10, 5]
        - id: lambda-worker
          asset: aws-lambda
          layer: compute
          at: [9, 6]
        - id: compute-label
          asset: text
          layer: labels
          at: [10, 2]
          text:
            value: |
              Compute
              Tier
            align: middle
            fontSize: 12
            fontWeight: 700
            lineHeight: 1.2
            fill: var(--iso-label)
      connections:
        - id: vpc-to-load-balancer
          from:
            element: vpc-gateway
            side: auto
          to:
            element: load-balancer
            side: auto
          routing:
            mode: orthogonal
            avoid: objects
          style:
            variant: road
            lane: center-dashed
            outline: var(--iso-road-outline)
            stroke: var(--iso-road)
            strokeWidth: 12
          start: none
          end: none
        - id: load-balancer-to-apps
          from:
            element: load-balancer
            side: bottom
          to:
            element: app-server-b
            side: right
          routing:
            mode: orthogonal
            avoid: objects
          style:
            pattern: dotted
            stroke: var(--iso-flow)
            strokeWidth: 4
          end: arrow
          ambient:
            - name: flow
  - id: data-services
    camera:
      target:
        reset: true
      duration: 500
      easing: ease-out
    add:
      elements:
        - id: database
          asset: aws-rds
          layer: data
          at: [12, 3]
        - id: object-store
          asset: aws-s3
          layer: data
          at: [12, 6]
        - id: data-label
          asset: text
          layer: labels
          at: [12, 2]
          text:
            value: |
              Data
              Services
            align: middle
            fontSize: 12
            fontWeight: 700
            lineHeight: 1.2
            fill: var(--iso-label)
      connections:
        - id: apps-to-database
          from:
            element: app-server-a
            side: auto
          to:
            element: database
            side: auto
          routing:
            mode: orthogonal
            avoid: objects
          style:
            pattern: dashed
            stroke: var(--iso-route)
            strokeWidth: 4
          end: arrow
        - id: lambda-to-object-store
          from:
            element: lambda-worker
            side: auto
          to:
            element: object-store
            side: auto
          routing:
            mode: orthogonal
            avoid: objects
          style:
            pattern: dotted
            stroke: var(--iso-flow)
            strokeWidth: 4
          end: arrow
          ambient:
            - name: flow
